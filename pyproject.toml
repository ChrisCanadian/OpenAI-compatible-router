[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-compatible-router"
version = "0.2.0"
description = "Ephemeral BYO OpenAI-compatible model router"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
